name: CI - TribuQuest Quality & Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Tests & Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mongomock-motor pytest pytest-asyncio httpx requests

      - name: Run Pytest Suite
        working-directory: ./backend
        env:
          USE_MOCK_DB: "true"
          JWT_SECRET: "a1c9d3b7f2e8a4c6b1d5e9f2a3c7b4d8e6f1a2c3b4d5e6f7a8b9c0d1e2f3a4b5"
          STORAGE_BACKEND: "local"
        run: |
          python -m pytest tests/ -v

  frontend-check:
    name: Frontend Lint & TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm install --legacy-peer-deps

      - name: Typecheck TypeScript
        working-directory: ./frontend
        run: |
          npx tsc --noEmit
